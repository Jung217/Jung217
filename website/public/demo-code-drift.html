<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>程式碼漂流 Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #090909;
      overflow: hidden;
      font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
    }
    canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
    }
    /* 模擬首頁內容，用來確認粒子在背景不影響閱讀 */
    .overlay-content {
      position: relative;
      z-index: 1;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      pointer-events: none;
    }
    .overlay-content h1 {
      font-size: 3.5rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }
    .overlay-content h1 span {
      color: #eab308;
    }
    .overlay-content p {
      font-size: 1.1rem;
      color: rgba(255,255,255,0.5);
      font-family: monospace;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="overlay-content">
    <h1>I'm <span>CJ Chien</span></h1>
    <p>// 程式碼漂流效果 Demo</p>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // === 設定 ===
    const PARTICLE_COUNT = 60;
    const MOUSE_RADIUS = 150;
    const MOUSE_FORCE = 0.08;
    // 程式碼片段素材
    const CODE_SNIPPETS = [
      '{', '}', '()', '=>', '/>', '</', '[]',
      'const', 'let', 'if', 'else', 'return',
      'async', 'await', 'import', 'export',
      'function', 'class', 'null', 'true',
      '===', '!==', '&&', '||',
      '0x3F', '0b1010', '/**/', '//',
      'npm', 'git', 'ssh', 'tcp',
      '<div>', '</>', '<?>', '<!>',
      'try', 'catch', 'throw', 'new',
      'this', 'self', 'void', 'type',
    ];
    // 配色 - 符合網站暗色主題
    const COLORS = [
      { r: 234, g: 179, b: 8 },    // 黃色 accent #eab308
      { r: 255, g: 255, b: 255 },   // 白色
      { r: 120, g: 120, b: 120 },   // 灰色
      { r: 180, g: 210, b: 115 },   // 綠色 (字串色)
      { r: 140, g: 170, b: 230 },   // 藍色 (關鍵字色)
      { r: 230, g: 130, b: 160 },   // 粉紅色 (函式色)
    ];

    let width, height;
    let mouse = { x: -9999, y: -9999 };
    let time = 0;
    let particles = [];

    // === 調整畫布大小 ===
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }

    // === 粒子類別 ===
    class Particle {
      constructor() {
        this.reset();
      }

      reset() {
        // 隨機程式碼片段
        this.text = CODE_SNIPPETS[Math.floor(Math.random() * CODE_SNIPPETS.length)];
        // 隨機顏色
        this.color = COLORS[Math.floor(Math.random() * COLORS.length)];

        // 深度層 (0~1, 越大越前面)
        this.depth = 0.2 + Math.random() * 0.8;
        // 依深度決定大小
        this.fontSize = 10 + this.depth * 16;
        // 依深度決定透明度
        this.baseAlpha = 0.08 + this.depth * 0.35;
        this.alpha = this.baseAlpha;

        // 初始位置 - 均勻分佈
        this.x = Math.random() * width;
        this.y = Math.random() * height;

        // 路徑參數
        this.baseSpeedX = (0.15 + Math.random() * 0.4) * this.depth;
        this.baseSpeedY = (0.05 + Math.random() * 0.15) * this.depth;
        this.driftDir = Math.random() > 0.5 ? 1 : -1;

        // 波浪參數
        this.waveAmplitude = 20 + Math.random() * 40;
        this.waveFrequency = 0.005 + Math.random() * 0.01;
        this.waveOffset = Math.random() * Math.PI * 2;

        // 旋轉
        this.rotation = Math.random() * Math.PI * 2;
        this.rotationSpeed = (Math.random() - 0.5) * 0.008 * this.depth;

        // 滑鼠互動位移
        this.pushX = 0;
        this.pushY = 0;

        // 閃爍
        this.flickerSpeed = 0.01 + Math.random() * 0.02;
        this.flickerOffset = Math.random() * Math.PI * 2;
      }

      update(dt) {
        // 基礎移動 - 向右漂移 + 微微上升
        this.x += this.baseSpeedX * this.driftDir;
        this.y -= this.baseSpeedY;

        // 波浪運動
        this.y += Math.sin(time * this.waveFrequency * 60 + this.waveOffset) * 0.3;
        this.x += Math.cos(time * this.waveFrequency * 30 + this.waveOffset) * 0.15;

        // 旋轉
        this.rotation += this.rotationSpeed;

        // 滑鼠互動
        const dx = this.x - mouse.x;
        const dy = this.y - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < MOUSE_RADIUS) {
          const force = (1 - dist / MOUSE_RADIUS) * MOUSE_FORCE;
          const angle = Math.atan2(dy, dx);
          this.pushX += Math.cos(angle) * force * 60;
          this.pushY += Math.sin(angle) * force * 60;
        }

        // 推力衰減
        this.x += this.pushX;
        this.y += this.pushY;
        this.pushX *= 0.92;
        this.pushY *= 0.92;

        // 閃爍效果
        const flicker = Math.sin(time * this.flickerSpeed * 60 + this.flickerOffset);
        this.alpha = this.baseAlpha + flicker * 0.06;

        // 邊界循環
        const margin = 80;
        if (this.x > width + margin) this.x = -margin;
        if (this.x < -margin) this.x = width + margin;
        if (this.y < -margin) this.y = height + margin;
        if (this.y > height + margin) this.y = -margin;
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        // 發光效果 (只有較亮的粒子)
        if (this.depth > 0.5) {
          ctx.shadowColor = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.alpha * 0.5})`;
          ctx.shadowBlur = 8 + this.depth * 12;
        }

        ctx.font = `${Math.round(this.fontSize)}px 'SF Mono', 'Fira Code', monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.alpha})`;
        ctx.fillText(this.text, 0, 0);

        ctx.restore();
      }
    }

    // === 連線效果 (近距離粒子之間) ===
    function drawConnections() {
      const maxDist = 120;
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const a = particles[i];
          const b = particles[j];
          // 只連接同深度層的粒子
          if (Math.abs(a.depth - b.depth) > 0.3) continue;

          const dx = a.x - b.x;
          const dy = a.y - b.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < maxDist) {
            const alpha = (1 - dist / maxDist) * 0.06 * Math.min(a.depth, b.depth);
            ctx.strokeStyle = `rgba(234, 179, 8, ${alpha})`;
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }
    }

    // === 初始化 ===
    function init() {
      resize();
      particles = [];
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push(new Particle());
      }
      // 依深度排序，遠的先畫
      particles.sort((a, b) => a.depth - b.depth);
    }

    // === 主迴圈 ===
    let lastTime = 0;
    function animate(timestamp) {
      const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
      lastTime = timestamp;
      time += dt;

      ctx.clearRect(0, 0, width, height);

      // 畫連線
      drawConnections();

      // 更新 & 繪製粒子
      for (const p of particles) {
        p.update(dt);
        p.draw();
      }

      requestAnimationFrame(animate);
    }

    // === 事件監聽 ===
    window.addEventListener('resize', () => {
      resize();
    });

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    window.addEventListener('mouseleave', () => {
      mouse.x = -9999;
      mouse.y = -9999;
    });

    // 觸控支援
    window.addEventListener('touchmove', (e) => {
      mouse.x = e.touches[0].clientX;
      mouse.y = e.touches[0].clientY;
    });

    window.addEventListener('touchend', () => {
      mouse.x = -9999;
      mouse.y = -9999;
    });

    // 啟動
    init();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
